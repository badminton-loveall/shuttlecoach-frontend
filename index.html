    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Password reset (?token=) and batch invite (/join/<token>) links carry
      // one-time secrets; report those pages to Analytics without them.
      (function () {
        var url = new URL(window.location.href);
        url.searchParams.delete('token');
        url.pathname = url.pathname.replace(/^\/join\/[^/]+/, '/join/invite');
        gtag('config', 'G-T05VGBH6WP', { page_location: url.toString() });
      })();
    </script>
